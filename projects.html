    const mo = st.mapOpen || '';
    const set = (patch) => this.setState({ tab, filter: f, mapOpen: mo, ...patch });
    const list = all.filter((p) => f === 'all' || p.pillars.indexOf(f) !== -1).map((p) => ({
      ...p,
      linkText: p.linkText || 'Read case study',
      hasImg: !!p.img, isAi: p.id === 'ai',
      isBtn: p.id === 'solar', isLink: p.id !== 'solar',
      go: () => set({ tab: 'maps' }),
      hasPm: p.pillars.indexOf('pm') !== -1, hasData: p.pillars.indexOf('data') !== -1, hasGis: p.pillars.indexOf('gis') !== -1
    }));
    const defs = [
      { id: 'all', label: 'All', dot: '#78716C' },
      { id: 'pm', label: 'Project Management', dot: '#7F1D1D' },
      { id: 'data', label: 'Data', dot: '#B8894A' },
      { id: 'gis', label: 'GIS', dot: '#2F5D7C' }
    ];
    const chips = defs.map((c) => {
      const on = f === c.id;
      return { ...c, count: String(c.id === 'all' ? all.length : all.filter((p) => p.pillars.indexOf(c.id) !== -1).length),
        pressed: on ? 'true' : 'false', bg: on ? '#1C1917' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1C1917', border: on ? '#1C1917' : '#D6CFC7',
        pick: () => set({ filter: c.id }) };
    });
    const maps = mapsAll.map((m) => {
      const isOpen = mo === m.id;
      return { ...m, isOpen, isShut: !isOpen, span: isOpen ? '1 / -1' : 'auto', toggle: () => set({ mapOpen: isOpen ? '' : m.id }) };
    });
    const tabs = [
      { id: 'projects', label: 'Projects', count: String(all.length) },
      { id: 'maps', label: 'Map gallery', count: String(mapsAll.length + 1) }
    ].map((t) => {
      const on = tab === t.id;
      return { ...t, sel: on ? 'true' : 'false', bar: on ? '#7F1D1D' : 'transparent', fg: on ? '#1C1917' : '#57534E',
        pillBg: on ? '#7F1D1D' : '#F5F0EB', pillFg: on ? '#FFFFFF' : '#57534E', pick: () => set({ tab: t.id }) };
    });
    const shown = list.length === all.length ? 'All ' + all.length + ' projects' : list.length + ' of ' + all.length + ' projects';
    return { list, chips, maps, tabs, shown, isProjects: tab === 'projects', isMaps: tab === 'maps' };
  }
}
return Component;
};
</script>
